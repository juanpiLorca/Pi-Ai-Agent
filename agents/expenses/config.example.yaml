# Copy to agents/expenses/config.yaml (git-ignored) and fill in.
# On the Pi, point EXPENSES_CONFIG at /etc/pi-agents/expenses.yaml instead.

payday: 28            # moved to the previous business day on weekends/holidays

# data_dir: /var/lib/pi-agents/expenses   # default: $STATE_DIRECTORY (systemd) or ./data

mail:
  source: imap        # imap (dedicated Gmail, app password) | graph (Outlook via Microsoft Graph)
  poll_seconds: 60
  imap:
    host: imap.gmail.com
    user: your.gastos.address@gmail.com
    folder: Gastos                  # the Gmail label your filter applies
    password_env: IMAP_PASSWORD     # the app password is read from this environment variable
  # graph:            # only if you can register an Entra app (docs/SETUP.md, appendix)
  #   client_id: "00000000-0000-0000-0000-000000000000"
  #   authority: https://login.microsoftonline.com/consumers   # Outlook.com; "organizations" for work/school
  #   folder: Gastos

capture:
  enabled: true       # save redacted bank/merchant emails to <data_dir>/samples/
  sender_domains: [bancochile.cl, bice.cl, rappi.com, rappi.cl, copec.cl]
  redact_names: ["Juan Lorca"]
  redact_emails: []   # the recipient address is always removed
